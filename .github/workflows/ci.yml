name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test

      # The e2e suite needs a browser. Linux runners have bundled Chromium available, which
      # is also the more reproducible choice — see src/capture/browser.ts.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
        env:
          CAROUSEL_CRAFTER_BROWSER: bundled
